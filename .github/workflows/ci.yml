name: CI/CD

on:
  push:
    branches:
      - "main"
      - "release/**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    if: github.ref_type == 'branch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ruff==0.16.4 mypy==1.15.0 pytest pytest-asyncio pyyaml types-cryptography

      - name: Lint
        run: ruff check .

      - name: Validate YAML
        run: python -c "import pathlib, yaml; [yaml.safe_load(path.read_text()) for pattern in ('*.yml', '*.yaml') for path in pathlib.Path('.').rglob(pattern)]"

      - name: Format check
        run: ruff format --check custom_components/vaillant_ebus/backend/grab_parser.py custom_components/vaillant_ebus/backend/dump_analysis.py custom_components/vaillant_ebus/backend/discovery_service.py custom_components/vaillant_ebus/backend/models.py custom_components/vaillant_ebus/backend/ebus_service.py custom_components/vaillant_ebus/backend/entity_factory.py custom_components/vaillant_ebus/backend/mapping.py custom_components/vaillant_ebus/coordinator.py custom_components/vaillant_ebus/dump_service.py

      - name: Type check
        run: mypy --strict --follow-imports=skip custom_components/vaillant_ebus/backend/grab_parser.py custom_components/vaillant_ebus/backend/dump_analysis.py custom_components/vaillant_ebus/backend/discovery_service.py custom_components/vaillant_ebus/backend/models.py custom_components/vaillant_ebus/backend/ebus_service.py

      - name: Test
        run: pytest -q tests/

      - name: Compile
        run: python3 -m compileall -f custom_components/vaillant_ebus/

      - name: Diff check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install ruff==0.16.4 mypy==1.15.0 pytest pytest-asyncio pyyaml types-cryptography

      - name: Lint
        run: ruff check .

      - name: Validate YAML
        run: python -c "import pathlib, yaml; [yaml.safe_load(path.read_text()) for pattern in ('*.yml', '*.yaml') for path in pathlib.Path('.').rglob(pattern)]"

      - name: Format check
        run: ruff format --check custom_components/vaillant_ebus/backend/grab_parser.py custom_components/vaillant_ebus/backend/dump_analysis.py custom_components/vaillant_ebus/backend/discovery_service.py custom_components/vaillant_ebus/backend/models.py custom_components/vaillant_ebus/backend/ebus_service.py custom_components/vaillant_ebus/backend/entity_factory.py custom_components/vaillant_ebus/backend/mapping.py custom_components/vaillant_ebus/coordinator.py custom_components/vaillant_ebus/dump_service.py

      - name: Type check
        run: mypy --strict --follow-imports=skip custom_components/vaillant_ebus/backend/grab_parser.py custom_components/vaillant_ebus/backend/dump_analysis.py custom_components/vaillant_ebus/backend/discovery_service.py custom_components/vaillant_ebus/backend/models.py custom_components/vaillant_ebus/backend/ebus_service.py

      - name: Test
        run: pytest -q tests/

      - name: Compile
        run: python3 -m compileall -f custom_components/vaillant_ebus/

      - name: Diff check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Build release zip
        run: |
          git archive --format=tar HEAD custom_components/vaillant_ebus | tar xf - -C /tmp
          cd /tmp/custom_components/vaillant_ebus && zip -qr /tmp/vaillant_ebus.zip .
          rm -rf /tmp/custom_components

      - name: Extract changelog entry
        run: |
          python3 -c "
          import re
          with open('CHANGELOG.md') as f:
            content = f.read()
          m = re.search(r'^##\s+.+?\s*\n(.*?)(?=\n##\s|\Z)', content, re.M|re.S)
          notes = m.group(1).strip() if m else 'Release ${{ github.ref_name }}'
          open('/tmp/release_notes.md','w').write(notes)
          "

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" /tmp/vaillant_ebus.zip --clobber
            gh release edit "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/release_notes.md
          else
            gh release create "${{ github.ref_name }}" /tmp/vaillant_ebus.zip \
              --title "${{ github.ref_name }}" \
              --notes-file /tmp/release_notes.md
          fi
