name: Discovery Dump
description: Share a register discovery dump for hardware-specific troubleshooting.
labels: ["discovery-dump"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to share your dump!

        Before submitting, please review the dump file for any sensitive information
        (serial numbers, installer codes, etc.) and redact if needed.

  - type: input
    id: dump_path
    attributes:
      label: Dump file path
      description: |
        Use the `vaillant_ebus.export_discovery_dump` service to generate the dump,
        then attach the resulting `.yaml` file from `/config/vaillant_ebus/`.
      placeholder: "e.g. /config/vaillant_ebus/discovery_dump_2026-07-26_143000.yaml"
    validations:
      required: true

  - type: textarea
    id: system_info
    attributes:
      label: System information
      description: What heat pump model, firmware version, and ebusd version are you running?
      placeholder: |
        Heat pump model: aroTHERM VWL 55/5 A
        ebusd version: 23.4
        HA version: 2026.7
    validations:
      required: true
