read_parameter:
  name: Read Parameter
  description: Read a single ebusd register by circuit and name.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    field:
      default: "value"
      selector:
        text:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

write_parameter:
  name: Write Parameter
  description: Write a value to an ebusd register with verification.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

refresh:
  name: Refresh
  description: Force re-read of all active registers.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

rediscover:
  name: Rediscover
  description: Re-run entity discovery via `find` command.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

analyze_registers:
  name: Analyze Registers
  description: Run background analysis on-demand to discover and enable new devices and entities.
  fields:
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:

export_discovery_dump:
  name: Export Discovery Dump
  description: Export all discovered registers plus full REGISTER_MAP to a YAML file for troubleshooting.
  fields:
    grab_duration:
      name: Grab Duration
      description: Capture raw eBUS traffic for N seconds before final dump (0 = disable)
      advanced: true
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
    entry_id:
      name: Config Entry
      description: Select the integration config entry when multiple are loaded. Optional with a single entry.
      advanced: true
      selector:
        text:
