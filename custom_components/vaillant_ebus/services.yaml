read_parameter:
  name: Read Parameter
  description: Read a single ebusd register by circuit and name.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    field:
      default: "value"
      selector:
        text:

write_parameter:
  name: Write Parameter
  description: Write a value to an ebusd register with verification.
  fields:
    circuit:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    value:
      required: true
      selector:
        text:

refresh:
  name: Refresh
  description: Force re-read of all active registers.

rediscover:
  name: Rediscover
  description: Re-run entity discovery via `find` command.

export_discovery_dump:
  name: Export Discovery Dump
  description: Export all discovered registers plus full REGISTER_MAP to a YAML file for troubleshooting.
  fields:
    grab_duration:
      name: Grab Duration
      description: Capture raw eBUS traffic for N seconds before final dump (0 = disable)
      advanced: true
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: seconds
